# Droits de l'agent DANS le cluster — le complément indispensable de config.yaml
#
# `config.yaml` dit QUI peut emprunter le tunnel (les jobs de ce projet). Ce
# fichier dit CE QUE le tunnel permet de faire. Les deux sont nécessaires, et
# c'est le second qu'on oublie : par défaut, le chart Helm de l'agent monte un
# ServiceAccount lié à **cluster-admin** — la documentation GitLab l'écrit
# elle-même (« For simplicity, the default Helm chart configuration sets up a
# service account for the agent with cluster-admin rights »).
#
# Ce que ça voudrait dire ici : n'importe quel job de CI de ce projet, sur
# n'importe quelle branche, pourrait tout faire sur le cluster. Or les jobs qui
# passent par l'agent ne font qu'une chose — `terraform plan` et
# `terraform apply` sur quatre types d'objets.
#
# POURQUOI CE RÔLE N'EST PAS GÉRÉ PAR TERRAFORM, alors qu'il gère déjà du RBAC
# ailleurs : c'est une dépendance d'amorçage. Terraform passe par l'agent, donc
# par ce rôle ; lui faire créer le rôle qui l'autorise supposerait qu'il ait
# déjà les droits qu'on cherche à lui accorder. Et l'état Terraform porterait
# alors les clés de ses propres permissions — un `terraform destroy` malheureux
# retirerait à l'agent le droit de se reconstruire. Ce fichier s'applique donc
# une fois, à la main, à l'installation, comme le chart lui-même.
#
# INSTALLATION
#   1. kubectl apply -f .gitlab/agents/microcrm/rbac.yaml
#   2. Installer (ou réinstaller) l'agent en lui désignant CE rôle au lieu de
#      cluster-admin :
#
#      helm repo add gitlab https://charts.gitlab.io && helm repo update
#      helm upgrade --install microcrm gitlab/gitlab-agent \
#        --namespace gitlab-agent-microcrm --create-namespace \
#        --set config.token=<jeton affiché par GitLab> \
#        --set config.kasAddress=grpcs://kas.gitlab.com \
#        --set rbac.useExistingRole=gitlab-agent-microcrm
#
#      Reprendre la commande que GitLab affiche (elle porte le jeton et le bon
#      kasAddress — `grpcs://` depuis la version 2.31 du chart, `wss://` avant)
#      et n'y ajouter QUE la dernière ligne. C'est elle qui remplace
#      cluster-admin ; sans elle, tout ce fichier est décoratif.
#
#   3. Vérifier, en se mettant à la place de l'agent — c'est le seul contrôle
#      qui vaille, un rôle trop étroit ne se voit qu'au premier apply :
#
#      SA=system:serviceaccount:gitlab-agent-microcrm:microcrm-gitlab-agent
#      kubectl auth can-i create namespaces        --as="$SA"   # yes
#      kubectl auth can-i create resourcequotas    --as="$SA"   # yes
#      kubectl auth can-i create networkpolicies   --as="$SA"   # yes
#      kubectl auth can-i create deployments       --as="$SA"   # no  ← le but
#      kubectl auth can-i get secrets -A           --as="$SA"   # no  ← le but
#
#      (namespace et ServiceAccount dépendent de la commande d'installation que
#      GitLab affiche : ici `--namespace gitlab-agent-microcrm` et une release
#      nommée `microcrm`, d'où le ServiceAccount `microcrm-gitlab-agent`.
#      `kubectl -n <namespace> get sa` donne le nom exact.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-agent-microcrm
  labels:
    app.kubernetes.io/name: gitlab-agent
    app.kubernetes.io/part-of: microcrm
  annotations:
    # Un rôle sans provenance est un rôle que personne n'ose modifier.
    microcrm.io/source: .gitlab/agents/microcrm/rbac.yaml
    microcrm.io/doc: TERRAFORM.md §4.1
rules:
  # --- Ce que terraform/modules/namespace crée -----------------------------
  # `delete` est inclus, et ce n'est pas anodin : supprimer un namespace
  # emporte tout ce qu'il contient. Il est là parce que Terraform en a besoin
  # pour `destroy` et pour remplacer un objet qu'il ne peut pas modifier en
  # place. Le garde-fou n'est donc pas ici — il est dans le fait que seuls les
  # jobs `terraform-apply-<env>` sont manuels et limités à `main`.
  - apiGroups: ['']
    resources: ['namespaces']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['']
    resources: ['resourcequotas', 'limitranges']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']

  # --- Ce que terraform/modules/network-policy crée ------------------------
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']

  # --- Découverte de l'API -------------------------------------------------
  # Le provider Kubernetes interroge les versions et les ressources
  # disponibles avant toute chose. Ces chemins sont normalement déjà ouverts à
  # tout compte authentifié (ClusterRole `system:discovery`), mais un cluster
  # peut l'avoir resserré — et l'échec se présenterait alors comme une erreur
  # de provider incompréhensible, pas comme un refus de droits.
  - nonResourceURLs: ['/version', '/api', '/api/*', '/apis', '/apis/*', '/openapi/v2']
    verbs: ['get']
# ⚠️ CE QUE CE RÔLE NE COUVRE PAS, volontairement :
#
#   - les objets applicatifs (Deployment, Service, Ingress, ConfigMap, Secret).
#     Ils sont déployés par `kubectl apply -k` dans les jobs de déploiement, qui
#     passent encore par la variable $KUBE_CONFIG et NON par l'agent. Le jour où
#     ces jobs basculeront sur le tunnel — ce qui serait une bonne chose, pour la
#     même raison qu'ici — ce rôle devra s'élargir, ou mieux : recevoir un second
#     rôle, lié à un second agent. Un agent par périmètre vaut mieux qu'un rôle
#     qui grossit.
#   - les modules GitOps et `user_access` de l'agent. Ils ne sont pas activés
#     dans config.yaml ; les activer demanderait d'autres droits.
---
# Le bail d'élection de leader — MESURÉ, pas anticipé.
#
# Avec `rbac.useExistingRole`, le chart REMPLACE la liaison vers cluster-admin,
# il n'ajoute rien : tout ce que cluster-admin couvrait par accident doit être
# redonné explicitement. Et l'agent a un besoin propre, qui n'a rien à voir avec
# Terraform — il tourne en deux réplicas depuis la version 1.17 du chart et
# s'élit un leader au moyen d'un Lease. Sans ce droit, ses journaux répètent :
#
#   leases.coordination.k8s.io "agent-<id>-lock" is forbidden:
#     User "system:serviceaccount:…:microcrm-gitlab-agent" cannot get resource
#     "leases" in API group "coordination.k8s.io"
#
# C'est un `Role`, pas un `ClusterRole` : le bail vit dans le namespace de
# l'agent, il n'y a aucune raison d'autoriser les baux du cluster entier.
# `delete` n'y figure pas — libérer un bail est une mise à jour, pas une
# suppression.
#
# ⚠️ Le namespace et le sujet ci-dessous sont ceux de la commande
# d'installation. Les changer dans le `helm upgrade` oblige à les changer ici.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-agent-microcrm-leaderelection
  namespace: gitlab-agent-microcrm
rules:
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']

  # L'élection de leader consigne son résultat dans un Event (« … became
  # leader »). Sans ce droit, tout FONCTIONNE — le leader est bien élu — mais
  # l'agent émet une ligne `ERROR` à chaque bascule : « Server rejected event
  # (will not retry!) ». Une erreur bénigne et récurrente est ce qui apprend à
  # ne plus lire les erreurs ; deux verbes la font disparaître, dans le seul
  # namespace de l'agent.
  - apiGroups: ['']
    resources: ['events']
    verbs: ['create', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-agent-microcrm-leaderelection
  namespace: gitlab-agent-microcrm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-agent-microcrm-leaderelection
subjects:
  - kind: ServiceAccount
    name: microcrm-gitlab-agent
    namespace: gitlab-agent-microcrm
