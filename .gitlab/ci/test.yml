# ---------------------------------------------------------------------------
# Test — les suites automatisées, y compris celle des scripts du dépôt — 3 job(s)
# ---------------------------------------------------------------------------
# Inclus par `.gitlab-ci.yml`. Les gabarits que ces jobs étendent vivent dans
# `.gitlab/ci/templates.yml` : `extends:` traverse un `include:`, une ancre YAML
# non — c'est toute la raison de la conversion (docs/pipeline-ci.md §6.1).
test-scripts:
  image: $PYTHON_IMAGE
  stage: test
  needs: []
  before_script:
    # `jq` sert au résumé de plan de terraform_check.sh. Sans lui, la suite
    # passe quand même — le script prévient et continue, et les tests le
    # vérifient — mais elle n'éprouve JAMAIS le calcul du résumé, c'est-à-dire
    # la seule partie qui contienne de la logique. Un test qui ne teste que la
    # branche « outil absent » donne une fausse impression de couverture.
    - apt-get update -qq && apt-get install -y --no-install-recommends jq
    - jq --version
  script:
    - bash scripts/tests/run_tests.sh
  extends: .rules_test

test-front:
  # $CYPRESS_IMAGE est référencée par digest, donc forcément en amd64 : c'est la
  # seule variante qui embarque Google Chrome. Le pourquoi, et pourquoi
  # `image:docker:platform` ne suffisait pas, sont dans .gitlab/ci/variables.yml.
  image: $CYPRESS_IMAGE
  stage: test
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  script:
    - cd front
    - npm ci
    - CHROME_BIN=/opt/google/chrome/chrome npx @angular/cli test --no-watch --no-progress --code-coverage --browsers=ChromeHeadlessNoSandbox
  artifacts:
    when: always
    paths:
      - front/coverage/
    expire_in: 1 day
  extends: [.cache_node, .rules_test_front]

test-back:
  image: $GRADLE_IMAGE
  stage: test
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  script:
    - cd back
    - ./gradlew test jacocoTestReport
  artifacts:
    when: always
    reports:
      junit: back/build/test-results/test/**/TEST-*.xml
    paths:
      - back/build/
    expire_in: 1 day
  extends: [.postgres_service, .cache_gradle, .rules_test_back]

# ===========================================================================
# QUALITY : on envoie le code à SonarQube et on regarde la qualité.
# Il faut avoir créé les variables SONAR_HOST_URL et SONAR_TOKEN dans GitLab.
# ===========================================================================
# Pas de service PostgreSQL ici, et ce n'est pas un oubli : `sonar` ne déclare
# qu'un `mustRunAfter` sur `test`, jamais un `dependsOn` — elle lit le XML repris
# en artefact. Idem pour spotbugs, dependency-check, coverage-gate et build-back.
