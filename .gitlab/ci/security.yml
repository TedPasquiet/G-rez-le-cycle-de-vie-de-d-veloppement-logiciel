# ---------------------------------------------------------------------------
# Sécurité — CVE des dépendances, secrets et misconfigurations du dépôt — 2 job(s)
# ---------------------------------------------------------------------------
# Inclus par `.gitlab-ci.yml`. Les gabarits que ces jobs étendent vivent dans
# `.gitlab/ci/templates.yml` : `extends:` traverse un `include:`, une ancre YAML
# non — c'est toute la raison de la conversion (docs/pipeline-ci.md §6.1).
dependency-check-back:
  image: $GRADLE_IMAGE
  stage: security
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  # On garde en cache la base NVD (.gradle/dependency-check-data) pour ne pas la
  # retélécharger à chaque fois : le 1er run est long, les suivants beaucoup moins.
  cache:
    - key:
        files:
          - back/build.gradle
      paths:
        - .gradle/caches
        - .gradle/wrapper
    - key: nvd-data
      paths:
        - .gradle/dependency-check-data
      when: always
  # Mesuré à 3 min 41 une fois le cache `nvd-data` réellement constitué.
  # 15 min laissent de la marge pour un rattrapage sans faire du délai un
  # plafond qui ne signale plus rien.
  timeout: 15 minutes
  script:
    - cd back
    - ./gradlew dependencyCheckAnalyze
  artifacts:
    when: always
    paths:
      - back/build/reports/dependency-check-report.*
    expire_in: 1 week
  # Bloquant : toute CVE >= CVSS 7 sur le runtimeClasspath arrête le pipeline.
  #
  # ⚠️ Ce commentaire affirmait que « le scan trouve 0 vulnérabilité, la porte se
  # ferme donc sur du vide ». C'était faux d'une façon qu'il ne soupçonnait pas :
  # le scan trouvait 0 parce qu'il n'analysait AUCUN jar. `runtimeClasspath`
  # était écartée comme « configuration de test » par le plugin (le détail est
  # dans back/build.gradle, à `skipTestGroups`). Le signe était sous les yeux :
  # 5 secondes de Gradle, un rapport XML de 1,4 Ko, `<dependencies>` vide.
  # C'est pourquoi Trivy trouvait dans le jar des CVE que ce job ne voyait pas.
  #
  # Depuis le 2026-10-02 il analyse réellement les 82 dépendances. Les
  # exceptions vivent dans back/config/dependency-check/suppressions.xml,
  # chacune justifiée et datée — et ce fichier dit aussi lesquelles ne sont PAS
  # accordées. Un job vert ici veut maintenant dire quelque chose ; un job
  # rouge aussi.
  allow_failure: false
  extends: .rules_test_back

trivy-fs:
  image:
    name: $TRIVY_IMAGE
    entrypoint: ['']
  stage: security
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  # Trivy regarde le code du dépôt et cherche des dépendances vulnérables ou des
  # secrets oubliés.
  #
  # ⚠️ `--ignorefile` n'est pas décoratif : Trivy ne lit que `.trivyignore` par
  # défaut, jamais `.trivyignore.yaml`. Sans ce drapeau, les exclusions
  # justifiées du dépôt ne s'appliquent pas et le job échoue sur 5 faux
  # positifs. Le format YAML est retenu parce qu'il borne chaque exclusion à un
  # chemin : une ligne `KSV-0014` dans un `.trivyignore` classique vaudrait pour
  # tout le dépôt et masquerait une régression réelle ailleurs.
  #
  # Bloquant : vérifié le 2026-09-19, le scan sort en 0 une fois les exclusions
  # appliquées. La porte se ferme donc sur du vide, et c'est ce qui serait
  # introduit ensuite qui arrêterait le pipeline.
  #
  # ⚠️ Le scan passe par scripts/ci/trivy_scan.sh, et plus par une ligne
  # `trivy fs` écrite ici. La porte n'a pas changé — mêmes scanners, mêmes
  # sévérités, même fichier d'exclusions, et le job échoue toujours au premier
  # constat. Ce qui a changé, c'est qu'il en reste une TRACE : un relevé JSON
  # et son tableau, publiés en artefacts même quand le job échoue
  # (`when: always`) — c'est précisément ce jour-là qu'on veut les lire.
  # Jusqu'ici les constats ne vivaient que dans le journal du job.
  #
  # L'image Trivy est basée sur Alpine et n'a pas bash : on l'installe, comme
  # le font déjà version-consistency et les jobs Terraform.
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/ci/trivy_scan.sh --mode fs --target .
      --report "$REPORTS_DIR/trivy-fs.json"
      --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
      --ignorefile .trivyignore.yaml
  artifacts:
    when: always
    paths:
      - $REPORTS_DIR/trivy-fs.json
      - $REPORTS_DIR/trivy-fs.txt
    expire_in: 1 week
  allow_failure: false
  extends: .rules_test

# ===========================================================================
# INFRA (Terraform et Ansible — l'infrastructure comme code)
# ===========================================================================
# Ces jobs valident ce qui PORTE l'application, là où les étapes précédentes
# valident l'application elle-même. Le partage des responsabilités est écrit
# dans ANSIBLE.md §2 : Ansible possède le poste et le cluster, Terraform le
# namespace et ses garde-fous, Kustomize l'application, la CI les secrets.
#
# Toute la logique vit dans scripts/ci/, pas dans ces blocs YAML — même règle
# que pour validate_k8s.sh (SCRIPTS.md) : un script est testable en local,
# relu par ShellCheck, et doublé de faux binaires qui permettent d'éprouver ses
# chemins d'échec dans test-scripts. Un bloc YAML n'est rien de tout cela.

# Validation hors ligne des configurations Terraform : mise en forme, puis
# `init -backend=false` et `validate` sur chaque environnement.
#
# `-backend=false` est ce qui rend le job jouable sur une branche de feature :
# il télécharge les providers sans jamais toucher à l'état, donc sans avoir
# besoin ni du backend ni d'un cluster.
