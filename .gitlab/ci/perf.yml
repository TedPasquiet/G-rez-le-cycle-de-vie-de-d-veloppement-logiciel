# ---------------------------------------------------------------------------
# Performance — k6 contre l'image réellement construite — 3 job(s)
# ---------------------------------------------------------------------------
# ⚠️ Ce fichier n'est PAS inclus par `.gitlab-ci.yml`. Il est assemblé par
# `perf-pipeline.yml`, la racine du pipeline ENFANT, que le job `perf` du parent
# déclenche (`trigger:`). Le pourquoi est écrit dans `perf-trigger.yml`.
#
# Les gabarits que ces jobs étendent vivent dans `.gitlab/ci/templates.yml`, que
# les deux racines incluent : `extends:` traverse un `include:`, une ancre YAML
# non (docs/pipeline-ci.md §6.1).
k6-smoke:
  extends: [.k6_template, .rules_build]
  script:
    - k6 run tests/k6/smoke.js

# Charge nominale : c'est ce job qui porte les vrais seuils de temps de réponse.
# Je le laisse en allow_failure pour l'instant, parce que les runners partagés
# GitLab sont mutualisés et que leurs mesures varient d'une exécution à l'autre :
# un seuil dur donnerait des échecs aléatoires sans rapport avec le code.
# Sur un runner dédié, passer allow_failure à false pour en faire un vrai gate.
k6-load:
  extends: [.k6_template, .rules_build]
  script:
    - k6 run tests/k6/load.js
  allow_failure: true

# Test de stress : on cherche volontairement le point de rupture. Ça n'a rien à
# faire dans un pipeline automatique (c'est long et ça sature le runner), donc
# il ne tourne que sur demande : « New pipeline » sur develop, main ou un tag,
# avec la variable K6_STRESS=true.
#
# Prérequis HORS DÉPÔT : Settings → CI/CD → Variables → « Minimum role to use
# pipeline variables » réglé sur Developer. Sur « No one allowed », le défaut
# des projets récents, le formulaire n'affiche même pas la section Variables et
# ce job devient impossible à lancer.
#
# ⚠️ Surtout pas `when: manual`. Sans allow_failure, un job manuel est BLOQUANT :
# ce pipeline enfant ne se terminerait jamais, et le job `perf` du parent
# (`strategy: depend`) retiendrait avec lui le déploiement qui le suit. La
# variable parvient jusqu'ici par `forward: pipeline_variables` (perf-trigger.yml).
k6-stress:
  extends: .k6_template
  script:
    - k6 run tests/k6/stress.js
  rules:
    - if: '$K6_STRESS != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ===========================================================================
# DEPLOY : déploiement sur Kubernetes + possibilité de revenir en arrière.
#
# Avant que ça marche, il faut créer ces variables dans GitLab :
#   KUBE_CONFIG  : le fichier de connexion au cluster (variable de type "File").
#   STAGING_NAMESPACE / PROD_NAMESPACE : les namespaces où déployer.
#
# J'ai mis les jobs en "manual" : ils ne partent pas tout seuls, il faut cliquer
# pour les lancer. Tant qu'on n'a pas de vrai cluster c'est plus prudent.
# (voir RELEASE.md pour rendre le staging automatique)
# ===========================================================================
