# ---------------------------------------------------------------------------
# Build et package — les artefacts, les images par SHA, la version, la Release — 7 job(s)
# ---------------------------------------------------------------------------
# Inclus par `.gitlab-ci.yml`. Les gabarits que ces jobs étendent vivent dans
# `.gitlab/ci/templates.yml` : `extends:` traverse un `include:`, une ancre YAML
# non — c'est toute la raison de la conversion (docs/pipeline-ci.md §6.1).
build-front:
  image: $NODE_IMAGE
  stage: build
  script:
    - cd front
    - npm ci
    - npx @angular/cli build --optimization
  artifacts:
    paths:
      - front/dist/
    expire_in: 1 week
  extends: [.cache_node, .rules_build]

build-back:
  image: $GRADLE_IMAGE
  stage: build
  script:
    - cd back
    - ./gradlew build -x test
  artifacts:
    paths:
      - back/build/libs/*.jar
    expire_in: 1 week
  extends: [.cache_gradle, .rules_build]

# ===========================================================================
# PACKAGE : on construit les images Docker et on les envoie sur le registry
# de GitLab (les variables $CI_REGISTRY_* sont fournies automatiquement).
# ===========================================================================
# ⚠️ L'image est scannée AVANT d'être poussée, par le même script (`--scan`).
#
# Ce n'était pas le cas : le scan était une ligne `docker run … trivy image`
# placée APRÈS build_and_push.sh. Le job rougissait bien, mais l'image était
# déjà au registry sous le tag du SHA — et `promote-*` ne demande que
# l'existence de ce tag. Un tag de release posé sur ce commit aurait donc promu
# une image que la porte venait de refuser. Constaté le 2026-10-02 :
# `back:5bf1d6a2` était au registry avec cinq CVE hautes, job rouge.
#
# La porte, elle, n'a pas changé : HIGH et CRITICAL bloquent. « Les deux images
# sortent à 0 » a été vrai le 2026-09-19 et ne l'est pas resté — la porte s'est
# fermée trois fois de suite sur `develop` début octobre, sur des CVE de Jackson
# publiées après le build précédent. C'est son rôle : une image saine un jour
# ne l'est pas pour toujours.
#
# Ce qui s'ajoute, c'est la TRACE. scripts/ci/trivy_scan.sh écrit un relevé
# JSON et son tableau, publiés en artefacts même quand le job échoue
# (`when: always`) : jusqu'ici les constats ne vivaient que dans le journal.
#
# `--trivy-image` : l'image du job (docker:24) n'embarque pas Trivy, il tourne
# donc dans son propre conteneur, contre le démon dind. Aucun fichier
# d'exclusions n'est passé : rien du dépôt n'est monté dans ce conteneur, et
# aucune exclusion n'est nécessaire sur les images.
package-back:
  extends: .package_template
  variables:
    IMAGE: '$CI_REGISTRY_IMAGE/$APP_BACK_NAME'
  script:
    - bash scripts/ci/build_and_push.sh --context ./back --image "$IMAGE" --tag "$CI_COMMIT_SHORT_SHA"
      --scan --scan-severity HIGH,CRITICAL
      --scan-report "$REPORTS_DIR/trivy-image-back.json" --trivy-image "$TRIVY_IMAGE"
  artifacts:
    when: always
    paths:
      - $REPORTS_DIR/trivy-image-back.json
      - $REPORTS_DIR/trivy-image-back.txt
    expire_in: 1 week

package-front:
  extends: .package_template
  variables:
    IMAGE: '$CI_REGISTRY_IMAGE/$APP_FRONT_NAME'
  script:
    - bash scripts/ci/build_and_push.sh --context ./front --image "$IMAGE" --tag "$CI_COMMIT_SHORT_SHA"
      --scan --scan-severity HIGH,CRITICAL
      --scan-report "$REPORTS_DIR/trivy-image-front.json" --trivy-image "$TRIVY_IMAGE"
  artifacts:
    when: always
    paths:
      - $REPORTS_DIR/trivy-image-front.json
      - $REPORTS_DIR/trivy-image-front.txt
    expire_in: 1 week

# ===========================================================================
# PROMOTION : on pose le numéro de version SemVer sur l'image déjà construite.
#
# Ces deux jobs ne tournent QUE sur un pipeline de tag, et package-back /
# package-front n'y tournent pas (`.rules_package`). Un pipeline de tag ne
# reconstruit donc rien : il retague.
#
# C'est ce qui fait qu'une version est traçable. `back:1.4.0` et
# `back:a1b2c3d` désignent le MÊME digest — celui que Trivy a scanné et que k6
# a mis sous charge. Une image reconstruite au moment du tag aurait les mêmes
# sources mais pas les mêmes couches, et « la version 1.4.0 » ne désignerait
# plus rien de vérifiable.
#
# Si le commit taggué n'a jamais vu son image poussée (tag posé sur une branche
# qui ne construit pas, ou pipeline en échec), le `docker pull` échoue et le job
# le dit explicitement. C'est le comportement voulu : on ne publie pas un numéro
# de version qui ne correspond à aucun artefact.
# ===========================================================================
promote-back:
  extends: .package_template
  variables:
    IMAGE: '$CI_REGISTRY_IMAGE/$APP_BACK_NAME'
  script:
    - bash scripts/ci/promote_image.sh --image "$IMAGE" --from-tag "$CI_COMMIT_SHORT_SHA" --version "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG'

promote-front:
  extends: .package_template
  variables:
    IMAGE: '$CI_REGISTRY_IMAGE/$APP_FRONT_NAME'
  script:
    - bash scripts/ci/promote_image.sh --image "$IMAGE" --from-tag "$CI_COMMIT_SHORT_SHA" --version "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG'

# ===========================================================================
# RELEASE : la page GitLab qui dit ce que contient la version.
#
# Un tag Git dit « cette version existe ». Il ne dit ni quelles images la
# portent, ni depuis quel commit. Tant que rien ne créait de Release, la
# question se réglait en allant lire le registry — et le projet a porté un tag
# `v1.0.0` sans aucune image `1.0.0` derrière, sans que rien ne le signale.
#
# `needs:` sur les DEUX promotions, et c'est ce qui donne son sens au job : la
# Release n'est créée que si `back:X.Y.Z` et `front:X.Y.Z` ont été poussées.
# Une Release qui annoncerait des images absentes serait pire que pas de
# Release. Il reste dans l'étape `package`, à côté de ce qu'il décrit — un
# `needs:` vers un job de la même étape est admis.
#
# Le mot-clé `release:` s'exécute APRÈS `script:` et seulement s'il a réussi ;
# il appelle `glab release create`, authentifié par le jeton du job
# ($CI_JOB_TOKEN) : aucun secret à créer. `script:` est obligatoire — ici il
# sert à écrire la description, que `release:description` lit comme un chemin
# de fichier relatif au dépôt.
#
# ⚠️ Si la Release existe déjà, le job ÉCHOUE (`glab … --no-update`) : rejouer
# un pipeline de tag ne réécrit pas l'histoire. Pour corriger une Release, on
# l'édite dans GitLab, ou on la supprime avant de rejouer ce job.
#
# ⚠️ Ne PAS saisir de « release notes » en créant le tag depuis l'interface
# GitLab : cela crée la Release aussitôt, et ce job échoue ensuite pour la
# raison ci-dessus (documentation GitLab, « Create a release when a Git tag is
# created »). Un tag poussé par `git push` n'a pas ce problème.
#
# La mise en production n'est PAS une condition : la Release dit « la version
# est publiée », `deploy-production` reste manuel et vient après.
# ===========================================================================
release:
  image: $GLAB_IMAGE
  stage: package
  needs: ['promote-back', 'promote-front']
  script:
    - sh scripts/ci/release_notes.sh "$REPORTS_DIR/release-notes.md"
    - cat "$REPORTS_DIR/release-notes.md"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'MicroCRM $CI_COMMIT_TAG'
    description: '$REPORTS_DIR/release-notes.md'
  artifacts:
    paths:
      - $REPORTS_DIR/release-notes.md
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'

# ===========================================================================
# PERF : tests de performance k6 (dossier tests/k6/).
#
# L'application testée est démarrée par GitLab comme un *service* : c'est
# l'image qu'on vient de packager, donc bien l'artefact qui partira en prod.
# k6 tourne dans le conteneur du job et l'appelle sur http://back:8080.
# D'où la place du stage, après `package` : ces jobs ont besoin de l'image.
#
# Quatre points à connaître :
#
#   1. L'entrypoint de l'image grafana/k6 est `k6` lui-même. On le neutralise
#      (entrypoint: ['']) pour que GitLab puisse lancer son propre shell.
#
#   2. Le conteneur k6 tourne avec un utilisateur non-root : il lit le dépôt
#      mais ne peut pas y écrire. On ne produit donc pas de rapport JSON en
#      artefact — le résumé de k6 est dans le log du job. Pour un rapport
#      exploitable, lancer scripts/tests/run_k6.sh en local.
#
#   3. L'attente du démarrage est faite par le scénario k6 lui-même (fonction
#      setup), pas par un `sleep` au jugé. C'est nécessaire : GitLab considère
#      un service comme prêt dès que son port répond, ce qui ne dit pas que
#      Spring Boot a fini de démarrer. C'est donc l'attente de setup qui fait
#      foi. (back/Dockerfile déclarait EXPOSE 4200 alors que l'application
#      écoute sur 8080 ; c'est corrigé.)
#
#   4. Pour voir les logs de l'application quand un job échoue, définir la
#      variable CI_DEBUG_SERVICES = "true" dans GitLab.
#
# Réglage de la charge : toute variable K6_* définie dans GitLab est vue par
# le scénario (K6_LOAD_VUS, K6_LOAD_DURATION...). Les seuils sont dans
# tests/k6/lib/config.js et ont vocation à y rester : les desserrer depuis
# l'interface viderait le gate de son sens.
# ===========================================================================
