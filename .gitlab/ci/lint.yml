# ---------------------------------------------------------------------------
# Lint — mise en forme et règles statiques, avant toute compilation — 5 job(s)
# ---------------------------------------------------------------------------
# Inclus par `.gitlab-ci.yml`. Les gabarits que ces jobs étendent vivent dans
# `.gitlab/ci/templates.yml` : `extends:` traverse un `include:`, une ancre YAML
# non — c'est toute la raison de la conversion (docs/pipeline-ci.md §6.1).
lint-front:
  image: $NODE_IMAGE
  stage: lint
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  script:
    - cd front
    - npm ci
    - npx @angular/cli lint
  extends: [.cache_node, .rules_test_front]

lint-back:
  image: $GRADLE_IMAGE
  stage: lint
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  script:
    - cd back
    - ./gradlew checkstyleMain
  extends: [.cache_gradle, .rules_test_back]

# ShellCheck vérifie mes scripts Bash et repère les erreurs classiques.
shellcheck:
  image:
    name: $SHELLCHECK_IMAGE
    entrypoint: ['']
  stage: lint
  # `needs: []` — démarre sans attendre l'étape précédente. Rien à recevoir :
  # ce job ne lit que les sources.
  needs: []
  script:
    - shellcheck --version
    # Les faux kubectl/docker/trivy des tests n'ont pas d'extension .sh (il faut
    # qu'ils portent exactement le nom de la vraie commande), donc je les ajoute
    # à la main à la liste des fichiers à vérifier.
    - find scripts -type f \( -name '*.sh' -o -path 'scripts/tests/stubs/*' \) -print0
      | xargs -0 shellcheck --external-sources
  extends: .rules_test

# Validation des manifestes Kubernetes (dossier k8s/), sans cluster.
#
# Tout le contenu est dans scripts/tests/validate_k8s.sh, au même titre que les
# autres scripts du dépôt : il est ainsi testable en local, relu par ShellCheck
# et documenté dans SCRIPTS.md, plutôt que noyé dans un bloc YAML.
#
# Le script construit chaque overlay avec le Kustomize embarqué dans kubectl,
# puis assère sur le rendu. Il attrape ce qui casse le plus souvent : un patch
# qui ne trouve pas sa cible, un fichier absent de `resources`, une ConfigMap
# référencée mais absente, une sonde visant un port non déclaré, et surtout le
# contrat de nommage avec scripts/deploy/deploy.sh (Deployment ET conteneur
# nommés $APP_BACK_NAME / $APP_FRONT_NAME) — qu'aucun validateur de schéma ne
# verrait, et qu'un `namePrefix:` ajouté par réflexe casserait.
#
# `--autotest` rejoue les mêmes assertions sur des rendus volontairement abîmés
# et vérifie qu'elles échouent : une assertion qui ne se déclenche jamais ne
# prouve rien.
#
# La limite à connaître, pour ne pas prêter à ce job plus de pouvoir qu'il n'en
# a : il ne valide PAS les manifestes contre le schéma de l'API Kubernetes.
# `kubectl apply --dry-run=client` en serait capable, mais contrairement à ce
# que son nom laisse croire il interroge le serveur — pour télécharger l'OpenAPI,
# et même avec --validate=false pour résoudre les types (« unable to
# recognize »). Or ce job tourne sur les branches de feature, où KUBE_CONFIG
# (protégée) n'est pas disponible. Une vraie validation de schéma hors ligne
# demanderait kubeconform, qui n'est pas dans l'image.
lint-k8s:
  image:
    name: $KUBECTL_IMAGE
    entrypoint: ['']
  stage: lint
  needs: []
  # alpine/kubectl n'a que busybox sh, et validate_k8s.sh est écrit en sh POSIX
  # exprès : pas d'`apk add bash` ici, donc pas de job de lint qui tombe parce
  # qu'un miroir Alpine est indisponible.
  script:
    - kubectl version --client
    - sh scripts/tests/validate_k8s.sh --autotest
  extends: .rules_test

# Validation du chart Helm, sans cluster.
#
# Le chart de helm/microcrm décrit la même application que les overlays
# Kustomize. Deux descriptions de la même chose, c'est deux occasions de
# diverger : ce job existe pour que la divergence se voie ici, et pas au
# déploiement.
#
# Trois contrôles, du plus faible au plus fort :
#
#   1. `helm lint` — syntaxe du chart et valeurs manquantes. Joué sur les DEUX
#      jeux de valeurs : un chart peut très bien se rendre avec les valeurs de
#      staging et échouer avec celles de production.
#   2. Les assertions de validate_k8s.sh, rejouées telles quelles sur le rendu
#      du chart. Le contrat de nommage avec deploy.sh, le socle de sécurité,
#      les tags figés et le pull secret valent pour le chart exactement comme
#      pour les overlays.
#   3. L'équivalence des deux rendus. C'est le contrôle qui compte : il compare
#      objet par objet ce que produit `helm template` et ce que produit
#      `kubectl kustomize`, et échoue à la moindre divergence. Sans lui, le
#      chart pourrait dériver silencieusement et ne plus décrire l'application
#      réellement déployée.
#
# C'est pour ce troisième point que le job tourne sur $HELM_IMAGE et non sur une
# image helm seule : il lui faut kubectl pour construire le rendu de référence.
#
# Le recouvrement avec lint-k8s est assumé — les deux jouent les assertions
# Kustomize. Chaque job reste ainsi autonome, et lint-k8s continue de passer sur
# une image qui n'a pas helm.
lint-helm:
  image:
    name: $HELM_IMAGE
    entrypoint: ['']
  stage: lint
  needs: []
  script:
    - helm version --short
    - kubectl version --client
    # `helm lint` ne lit pas les fichiers de valeurs d'environnement tout seul :
    # sans -f, il ne validerait que values.yaml, c'est-à-dire le seul jeu que
    # personne ne déploie.
    - helm lint "$HELM_CHART_DIR" -f "$HELM_CHART_DIR/values-staging.yaml"
    - helm lint "$HELM_CHART_DIR" -f "$HELM_CHART_DIR/values-production.yaml"
    - sh scripts/tests/validate_k8s.sh --autotest
  extends: .rules_test

# ===========================================================================
# TEST (produisent la couverture consommée par SonarQube)
# ===========================================================================
#
# Base réelle des jobs qui exécutent la suite du back : une suite verte sur
# HSQLDB ne dit rien du moteur qu'on déploie. La bascule tient aux seules
# SPRING_DATASOURCE_* — sans elles, le back reste sur HSQLDB.
#
# Deux pièges : l'hôte est l'ALIAS du service, jamais `localhost` (conteneur
# voisin) ; les variables du job sont injectées dans le service aussi, d'où les
# SPRING_* dérivées des POSTGRES_*.
