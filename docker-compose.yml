# Stack applicative locale.
#
# Les noms d'images et les ports publiés ont des valeurs par défaut utilisables
# telles quelles. Pour en changer sans toucher à ce fichier, créer un `.env` à
# côté (voir .env.example) — Docker Compose le lit automatiquement.
services:
  back:
    build:
      context: ./back
    image: ${BACK_IMAGE:-back-p6}
    ports:
      - '${BACK_PORT:-8080}:8080'
    environment:
      # Origines autorisées à appeler l'API. Doit inclure l'URL du front.
      MICROCRM_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
  front:
    build:
      context: ./front
    image: ${FRONT_IMAGE:-front-p6}
    ports:
      - '${FRONT_PORT:-4200}:80'
