name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push all branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/pasquietted/G-rez-le-cycle-de-vie-de-d-veloppement-logiciel.git
          # Récupère toutes les branches distantes dans refs/remotes/origin/*
          # (évite de toucher la branche checkoutée, contrairement à un fetch dans refs/heads).
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          # Miroir de toutes les branches et de tous les tags vers GitLab.
          # --prune supprime côté GitLab les branches qui n'existent plus sur GitHub
          # (sinon une branche supprimée ou renommée y resterait pour toujours).
          # GitLab est donc un miroir en lecture seule : ne jamais y committer,
          # tout ce qui n'est pas sur GitHub finit par y être effacé.
          git push gitlab --prune '+refs/remotes/origin/*:refs/heads/*'
          git push gitlab --tags
