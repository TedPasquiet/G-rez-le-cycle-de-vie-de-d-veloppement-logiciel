apiVersion: apps/v1
kind: Deployment
metadata:
  # ⚠️ Nom contractuel, sans préfixe de release : deploy.sh cible
  # `deployment/front`. Voir _helpers.tpl.
  name: front
  labels:
    app.kubernetes.io/name: front
    app.kubernetes.io/component: web
    {{- include "microcrm.labels" . | nindent 4 }}
spec:
  # Le front ne sert que des fichiers statiques : aucun état, donc il peut
  # monter en replicas sans précaution, contrairement au back.
  replicas: {{ .Values.front.replicas }}
  revisionHistoryLimit: 3
  # ⚠️ Sélecteur réduit à `name` — immuable après création, voir
  # back-deployment.yaml.
  selector:
    matchLabels:
      app.kubernetes.io/name: front
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front
        app.kubernetes.io/component: web
        {{- include "microcrm.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # Voir back-deployment.yaml pour la justification, et K8S.md §12.
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        # L'image caddy:2-alpine tourne en root par défaut. Rien dans Caddy ne
        # l'exige ici : on lui impose donc un UID non privilégié. 1000 n'existe
        # pas dans /etc/passwd de l'image, ce qui est sans conséquence — Caddy
        # n'a pas besoin de résoudre son propre utilisateur.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ⚠️ Nom contractuel : `kubectl set image deployment/front front=<image>`.
        - name: front
          image: {{ include "microcrm.image" (dict "root" . "name" "front") }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # Référence de clé explicite plutôt qu'un `envFrom` sur toute la
          # ConfigMap : le front n'a rien à faire de MICROCRM_CORS_ALLOWED_ORIGINS,
          # et injecter des variables dont un conteneur n'a pas l'usage rend plus
          # difficile de savoir qui consomme quoi.
          env:
            - name: FRONT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: microcrm-config
                  key: FRONT_API_BASE_URL
          # Ressources d'un serveur de fichiers statiques : Caddy est un binaire
          # Go qui sert le bundle Angular depuis le disque. Mesuré au repos bien
          # en dessous de 32 Mio ; la limite à 64 Mio laisse de la marge pour le
          # cache de fichiers sans permettre une dérive. Identiques dans tous les
          # environnements, d'où l'absence de values.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          # Caddy n'expose pas d'endpoint de santé applicatif (son API d'admin
          # écoute sur localhost:2019 et n'est pas joignable depuis le kubelet).
          # On interroge donc `/`, qui renvoie index.html : c'est exactement ce
          # que le service doit savoir faire.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
              # ⚠️ NET_BIND_SERVICE est rendue, et ce n'est pas un confort : le
              # binaire /usr/bin/caddy porte la capability de fichier
              # `cap_net_bind_service=ep`. Quand elle ne figure pas dans
              # l'ensemble limitant du conteneur, le noyau refuse l'`exec`
              # lui-même — arrêt sur « exec /usr/bin/caddy: operation not
              # permitted », avant même d'ouvrir un port. Le comportement est
              # identique en root comme en non-root et sur un port haut : passer
              # le Caddyfile en :8080 ne résoudrait rien. Voir K8S.md §11.
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            # readOnlyRootFilesystem, encore : Caddy écrit son autosave de
            # configuration dans /config et ses données (stockage TLS) dans
            # /data. Il démarre et sert sans ces volumes, mais log deux erreurs
            # à chaque lancement.
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
