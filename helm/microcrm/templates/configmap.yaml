apiVersion: v1
kind: ConfigMap
metadata:
  # Nom contractuel : référencé par l'`envFrom` du back et le `configMapKeyRef`
  # du front. Aucun préfixe de release — voir _helpers.tpl.
  name: microcrm-config
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
data:
  # Origines autorisées à appeler l'API. Lue par le back au démarrage
  # (@Value("${microcrm.cors.allowed-origins}") dans
  # SpringDataRestCustomization.java, surchargée par cette variable
  # d'environnement).
  MICROCRM_CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}

  # URL de l'API vue depuis le NAVIGATEUR de l'utilisateur, pas depuis le
  # cluster : c'est le code Angular exécuté sur le poste de l'utilisateur qui
  # appelle l'API, un nom de Service Kubernetes n'y serait pas résoluble.
  #
  # Consommée par le conteneur front, qui la passe à Caddy ; Caddy la sert sur
  # /config.json et le bundle Angular la lit avant de démarrer. C'est ce qui
  # permet à une seule image de servir tous les environnements. Voir K8S.md §13.
  FRONT_API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
