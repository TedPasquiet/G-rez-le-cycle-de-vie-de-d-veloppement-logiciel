apiVersion: v1
kind: ConfigMap
metadata:
  name: microcrm-config
data:
  # Origines autorisées à appeler l'API. Lue par le back au démarrage
  # (@Value("${microcrm.cors.allowed-origins}") dans
  # SpringDataRestCustomization.java, surchargée par cette variable
  # d'environnement). La valeur ci-dessous est celle du poste de développement ;
  # chaque overlay la remplace par l'hôte réel du front.
  MICROCRM_CORS_ALLOWED_ORIGINS: http://localhost:4200

  # URL de l'API vue depuis le NAVIGATEUR de l'utilisateur, pas depuis le
  # cluster : c'est le code Angular exécuté sur le poste de l'utilisateur qui
  # appelle l'API, un nom de Service Kubernetes n'y serait pas résoluble.
  #
  # Consommée par le conteneur front (k8s/base/front-deployment.yaml), qui la
  # passe à Caddy ; Caddy la sert sur /config.json et le bundle Angular la lit
  # avant de démarrer. Une seule image pour tous les environnements.
  #
  # La valeur ci-dessous est celle de la stack locale ; chaque overlay la
  # remplace par l'hôte d'API réel de son environnement.
  FRONT_API_BASE_URL: http://localhost:8080
