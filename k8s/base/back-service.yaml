apiVersion: v1
kind: Service
metadata:
  name: back
  labels:
    app.kubernetes.io/name: back
    app.kubernetes.io/component: api
spec:
  # ClusterIP : l'exposition vers l'extérieur est le rôle de l'Ingress, pas
  # celui du Service. Un NodePort ou un LoadBalancer par service contournerait
  # l'Ingress et sortirait du contrôle de routage.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: back
  ports:
    - name: http
      port: 8080
      targetPort: http
