apiVersion: v1
kind: ConfigMap
metadata:
  name: microcrm-config
data:
  # Origine du front de staging : c'est elle que le navigateur enverra dans
  # l'en-tête Origin quand l'application appellera l'API. Doit correspondre
  # exactement à l'hôte déclaré dans ingress-patch.yaml (schéma compris).
  MICROCRM_CORS_ALLOWED_ORIGINS: https://microcrm.staging.example.com
  # URL que le navigateur utilisera pour joindre l'API : l'hôte d'API déclaré
  # dans ingress-patch.yaml, et non un nom de Service interne au cluster.
  FRONT_API_BASE_URL: https://api.microcrm.staging.example.com
