apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de production. Mêmes partis pris que staging (pas de `namespace:`,
# pas de `namePrefix:`) — voir k8s/overlays/staging/kustomization.yaml pour la
# justification, et K8S.md §4.

resources:
  - ../../base

labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: microcrm-production
      app.kubernetes.io/environment: production

replicas:
  # Le front est sans état : deux replicas donnent de la disponibilité pendant
  # les mises à jour et couvrent la perte d'un nœud.
  - name: front
    count: 2
  # ⚠️ Le back reste à 1, et ce n'est pas provisoire tant que la base n'est pas
  # externalisée : HSQLDB vit dans la mémoire du processus. À 2 replicas, deux
  # jeux de données divergeraient sans qu'aucune erreur ne soit levée — un
  # client créé sur un pod serait invisible une requête sur deux. Voir K8S.md §8.1.
  - name: back
    count: 1

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: back-resources-patch.yaml
