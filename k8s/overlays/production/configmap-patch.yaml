apiVersion: v1
kind: ConfigMap
metadata:
  name: microcrm-config
data:
  # Origine du front de production. Une seule origine, sans joker : la liste
  # explicite est le choix déjà fait dans application.properties.
  MICROCRM_CORS_ALLOWED_ORIGINS: https://microcrm.example.com
  # URL que le navigateur utilisera pour joindre l'API : l'hôte d'API déclaré
  # dans ingress-patch.yaml, et non un nom de Service interne au cluster.
  FRONT_API_BASE_URL: https://api.microcrm.example.com
