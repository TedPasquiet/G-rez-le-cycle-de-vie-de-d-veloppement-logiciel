apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: logging
spec:
  # Même raison que pour Elasticsearch : sans `xpack.security`, Kibana n'a
  # aucune page de connexion. Un Ingress ouvrirait l'accès en écriture aux
  # objets sauvegardés — et à la console Dev Tools, donc à Elasticsearch — pour
  # qui atteint le cluster. L'accès se fait par
  # `kubectl -n logging port-forward svc/kibana 5601:5601`.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
