apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: logging
spec:
  accessModes:
    # ReadWriteOnce et pas davantage : un nœud Elasticsearch verrouille son
    # répertoire de données (node.lock). Deux processus sur le même volume ne se
    # partagent pas les index, le second refuse de démarrer. Cette contrainte est
    # aussi ce qui justifie `strategy: Recreate` dans le Deployment.
    - ReadWriteOnce
  resources:
    requests:
      # 5 Gio, décidés à partir de ce qui va réellement s'y écrire plutôt que
      # d'un chiffre rond.
      #
      # Ce que le volume doit absorber : les logs d'un back Spring Boot et d'un
      # front Caddy sur un environnement de démonstration, soit un ordre de
      # grandeur de quelques Mio par jour une fois indexés. Même en indexant sans
      # rotation pendant des mois, on reste loin du Gio.
      #
      # Ce qui impose malgré tout de voir plus grand que l'usage :
      #   - Elasticsearch applique des seuils de disque (`low` à 85 %, `high` à
      #     90 %, `flood_stage` à 95 %) calculés sur le SYSTÈME DE FICHIERS. Un
      #     volume trop juste bascule les index en lecture seule, et cet état ne
      #     se lève pas tout seul même après avoir fait de la place ;
      #   - les fusions de segments recopient les segments avant de supprimer les
      #     anciens : il faut de la place libre pour l'index lui-même, pas
      #     seulement pour sa taille finale ;
      #   - le translog et les instantanés de reprise vivent sur le même volume.
      #
      # 5 Gio laissent ces marges tout en restant négligeables devant les ~889
      # Gio libres du nœud minikube. La StorageClass par défaut
      # (`standard`, provisionneur hostpath) n'autorise pas l'extension à chaud
      # (allowVolumeExpansion=false) : agrandir plus tard voudrait dire recréer
      # le PVC et perdre les index, ce qui est une raison de plus de ne pas viser
      # au plus juste maintenant.
      storage: 5Gi
  # Aucun `storageClassName` : le cluster a une StorageClass par défaut
  # (`standard`, addon default-storageclass). La nommer ici figerait un détail
  # d'infrastructure dans le dépôt — la même raison qui garde le namespace
  # dehors (K8S.md §4) — et ferait échouer le PVC sur tout cluster où elle
  # s'appelle autrement (`gp2`, `standard-rwo`, `local-path`...).
