plugins {
	id 'java'
	id 'jacoco'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.0.15'
	id 'org.owasp.dependencycheck' version '12.2.2'
	id 'org.sonarqube' version '5.1.0.4882'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

// Linting statique du source Java. Ruleset : back/config/checkstyle/checkstyle.xml
checkstyle {
	toolVersion = '10.17.0'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
	// Bloque le build sur une violation. Passer à true pour un mode purement
	// consultatif (rapport publié sans faire échouer la CI).
	ignoreFailures = false
	// Le linting concerne le code de production ; les tests suivent des
	// conventions plus souples (fixtures, noms verbeux).
	sourceSets = [sourceSets.main]
}

// Formatage automatique du code Java (branché sur le hook pre-commit via
// lint-staged). Volontairement non-invasif : on n'impose pas un style complet
// (google-java-format), on nettoie l'essentiel — cohérent avec Checkstyle.
spotless {
	java {
		target 'src/**/*.java'
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		indentWithSpaces(4)
	}
}

// Couverture de test au format XML, consommée par SonarQube.
jacoco {
	toolVersion = '0.8.12'
}
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Analyse statique (recherche de bugs). Exclusions : back/config/spotbugs/exclude.xml
spotbugs {
	excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
	// Publie le rapport sans faire échouer le build ; passer à false pour un gate dur.
	ignoreFailures = true
}
spotbugsMain {
	reports {
		xml.required = true
		html.required = true
	}
}

// SCA : dépendances vulnérables (OWASP). Faux positifs : suppressions.xml
dependencyCheck {
	suppressionFile = "${rootDir}/config/dependency-check/suppressions.xml"
	formats = ['HTML', 'XML']
	// Score CVSS à partir duquel le build échoue (7 = High). Mettre 11 pour ne jamais bloquer.
	failBuildOnCVSS = 7
	// On n'analyse que ce qui part réellement dans le jar livré. Sans ça le scan
	// couvre aussi les outils de build (checkstyle, spotbugs, jacoco...) : plus lent,
	// et des CVE qui ne concernent pas l'application déployée.
	scanConfigurations = ['runtimeClasspath']
	analyzers {
		// Sonatype OSS Index : sans compte il est throttlé et échoue sur chaque
		// jar (des dizaines de lignes d'erreur dans le log). Le NVD suffit ici.
		ossIndexEnabled = false
	}
	// Depuis 2023 le NVD exige une clé API pour éviter le throttling. Voir variable CI NVD_API_KEY.
	// Sans elle le premier téléchargement de la base prend ~1 h au lieu de ~5 min.
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
}

// Métadonnées d'analyse SonarQube du back. host.url + token passés en CI.
sonar {
	properties {
		property 'sonar.projectKey', 'pasquietted_G-rez-le-cycle-de-vie-de-d-veloppement-logiciel'
		property 'sonar.projectName', 'MicroCRM - Backend'
		property 'sonar.organization', 'pasquietted'
		property 'sonar.coverage.jacoco.xmlReportPaths',
			"${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Génère automatiquement le rapport de couverture après les tests.
    finalizedBy jacocoTestReport
}