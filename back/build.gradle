plugins {
	id 'java'
	id 'jacoco'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.0.15'
	id 'org.owasp.dependencycheck' version '12.2.2'
	id 'org.sonarqube' version '5.1.0.4882'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

// Linting statique du source Java. Ruleset : back/config/checkstyle/checkstyle.xml
checkstyle {
	toolVersion = '10.17.0'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
	// Bloque le build sur une violation. Passer à true pour un mode purement
	// consultatif (rapport publié sans faire échouer la CI).
	ignoreFailures = false
	// Le linting concerne le code de production ; les tests suivent des
	// conventions plus souples (fixtures, noms verbeux).
	sourceSets = [sourceSets.main]
}

// Formatage automatique du code Java (branché sur le hook pre-commit via
// lint-staged). Volontairement non-invasif : on n'impose pas un style complet
// (google-java-format), on nettoie l'essentiel — cohérent avec Checkstyle.
spotless {
	java {
		target 'src/**/*.java'
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		indentWithSpaces(4)
	}
}

// Couverture de test au format XML, consommée par SonarQube.
jacoco {
	toolVersion = '0.8.12'
}
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Seuil de couverture appliqué localement, dans `./gradlew check`.
//
// Il fait doublon avec scripts/ci/check_coverage.py — volontairement. Le script
// est le garde-fou de la CI (il lit le XML, il marche sans réseau) ; cette règle
// est celui du poste de développement : elle échoue avant le push, pas après.
// Un seuil qui ne se déclenche qu'en CI se découvre toujours trop tard.
//
// Deux compteurs plutôt qu'un : la couverture de LIGNES seule se satisfait de
// tests qui traversent le code sans jamais emprunter la branche d'erreur. C'est
// exactement ce qui laissait passer les 500 corrigés sur les suppressions.
jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			// MicroCRMApplication.main() ne contient que l'amorçage Spring Boot :
			// le couvrir demanderait de démarrer un vrai serveur pour zéro
			// information. C'est la seule exclusion, et elle est nommée — pas un
			// motif large qui absorberait silencieusement du code métier.
			excludes = ['com.openclassroom.devops.orion.microcrm.MicroCRMApplication']
			limit {
				counter = 'LINE'
				minimum = 0.95
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}
tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

// Tests de mutation (PIT).
//
// Réponse à la question que la couverture ne sait pas poser : « ces tests
// vérifient-ils quelque chose ? ». JaCoCo compte les lignes exécutées ; un test
// sans aucune assertion affiche 100 %. PIT modifie le bytecode — inverse une
// condition, remplace un retour par null, vide un appel — puis relance les tests
// qui couvrent la ligne. Si aucun ne devient rouge, le mutant « survit » : cette
// ligne est traversée mais pas vérifiée.
//
// Hors de `check` : PIT relance la suite une fois par mutant, c'est trop lent
// pour un cycle de développement. Il tourne à la demande et dans son propre job
// de CI (`./gradlew pitest`).
pitest {
	pitestVersion = '1.16.1'
	// Sans ce greffon, PIT ne voit aucun test : la suite est en JUnit 5.
	junit5PluginVersion = '1.2.1'
	targetClasses = ['com.openclassroom.devops.orion.microcrm.*']
	// Même exclusion que pour la couverture, pour la même raison.
	excludedClasses = ['com.openclassroom.devops.orion.microcrm.MicroCRMApplication']
	// DEFAULTS couvre les mutations classiques (conditions, retours, arithmétique).
	// On y ajoute les opérateurs qui touchent précisément ce qu'un modèle JPA
	// fait de plus fragile : les appels sans valeur de retour (VOID_METHOD_CALLS,
	// par exemple `org.removePerson(this)` retiré du hook @PreRemove) et les
	// retours de collections vides ou nulles.
	mutators = ['DEFAULTS', 'VOID_METHOD_CALLS', 'EMPTY_RETURNS', 'NULL_RETURNS']
	// Échoue si la proportion de mutants tués passe sous ce seuil. Surchargeable
	// par MUTATION_MIN, la variable du pipeline (voir .gitlab-ci.yml), sur le
	// même principe que SONAR_* et NVD_API_KEY plus haut : la valeur écrite ici
	// est le défaut utilisable en local, pas la référence.
	mutationThreshold = (System.getenv('MUTATION_MIN') ?: '80') as int
	// Un mutant qui ne fait échouer aucun test parce qu'AUCUN test ne couvre la
	// ligne serait un faux confort : on exige aussi une couverture de test réelle.
	coverageThreshold = 90
	timestampedReports = false
	outputFormats = ['HTML', 'XML']
	threads = 2
	// Les tests de mutation ne s'exécutent que si la suite passe d'abord.
	verbose = false
	// PIT lance ses propres JVM, qui n'héritent pas des `systemProperty` de la
	// tâche `test` : sans cet argument, ddl-auto retombe à `none` et tous les
	// tests échouent contre une base vierge — donc à chaque exécution en CI.
	jvmArgs = ['-Dspring.jpa.hibernate.ddl-auto=update']
}

// Analyse statique (recherche de bugs). Exclusions : back/config/spotbugs/exclude.xml
spotbugs {
	excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
	// Publie le rapport sans faire échouer le build ; passer à false pour un gate dur.
	ignoreFailures = true
}
spotbugsMain {
	reports {
		xml.required = true
		html.required = true
	}
}
// Même choix que pour Checkstyle plus haut : l'analyse porte sur le code de
// production. Sur le code de test elle ne produisait que des faux positifs
// « valeur potentiellement nulle » sur les en-têtes HTTP lus dans les
// assistants de test — dont l'absence est précisément ce que le test vérifie
// juste avant, par un `requireNonNull` que l'analyseur ne modélise pas.
spotbugsTest {
	enabled = false
}

// SCA : dépendances vulnérables (OWASP). Faux positifs : suppressions.xml
dependencyCheck {
	suppressionFile = "${rootDir}/config/dependency-check/suppressions.xml"
	formats = ['HTML', 'XML']
	// Score CVSS à partir duquel le build échoue (7 = High). Mettre 11 pour ne jamais bloquer.
	failBuildOnCVSS = 7
	// On n'analyse que ce qui part réellement dans le jar livré. Sans ça le scan
	// couvre aussi les outils de build (checkstyle, spotbugs, jacoco...) : plus lent,
	// et des CVE qui ne concernent pas l'application déployée.
	scanConfigurations = ['runtimeClasspath']
	analyzers {
		// Sonatype OSS Index : sans compte il est throttlé et échoue sur chaque
		// jar (des dizaines de lignes d'erreur dans le log). Le NVD suffit ici.
		ossIndexEnabled = false
	}
	// Depuis 2023 le NVD exige une clé API pour éviter le throttling. Voir variable CI NVD_API_KEY.
	// Sans elle le premier téléchargement de la base prend ~1 h au lieu de ~5 min.
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
}

// Métadonnées d'analyse SonarQube du back. host.url + token passés en CI.
//
// La clé de projet et l'organisation viennent des variables du pipeline
// (SONAR_PROJECT_KEY_BACK, SONAR_ORGANIZATION, définies dans .gitlab-ci.yml).
// Les valeurs écrites ici ne servent que de repli, pour qu'un `./gradlew sonar`
// lancé en local vise le bon projet sans avoir à exporter quoi que ce soit.
sonar {
	properties {
		property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY_BACK')
			?: 'pasquietted_G-rez-le-cycle-de-vie-de-d-veloppement-logiciel'
		property 'sonar.projectName', 'MicroCRM - Backend'
		property 'sonar.organization', System.getenv('SONAR_ORGANIZATION') ?: 'pasquietted'
		property 'sonar.coverage.jacoco.xmlReportPaths',
			"${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

// Le plugin Spring Boot produit deux archives dans build/libs : le jar
// exécutable (bootJar) et un « -plain.jar » qui ne contient que les classes,
// inutile ici. Le désactiver laisse un seul fichier, ce qui permet au
// Dockerfile de le copier avec un motif build/libs/*.jar sans avoir à écrire
// le numéro de version en dur.
tasks.named('jar') {
	enabled = false
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	// Actuator : expose /actuator/health, dont les sous-ressources liveness et
	// readiness consommées par les probes Kubernetes (voir K8S.md §5).
	// L'exposition est volontairement réduite dans application.properties.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	// Encodeur de logs JSON, consommé uniquement par logback-spring.xml : aucune
	// classe Java n'y fait référence, d'où `runtimeOnly` plutôt qu'`implementation`
	// (il reste hors du classpath de compilation, donc personne ne peut coupler le
	// code applicatif à une API de journalisation tierce par inadvertance).
	//
	// Pourquoi cette bibliothèque et pas Spring Boot lui-même : le *structured
	// logging* natif (logging.structured.format.console=ecs) n'arrive qu'en Spring
	// Boot 3.4 ; on est en 3.2.5 et monter la version du framework pour un besoin
	// d'observabilité serait un risque sans rapport avec le gain.
	//
	// Pourquoi ECS et pas net.logstash.logback:logstash-logback-encoder : les deux
	// produisent du JSON valide, mais l'encodeur Elastic émet directement le schéma
	// ECS (@timestamp, log.level, log.logger, error.stack_trace...), qui est celui
	// que les index templates et les écrans prêts à l'emploi de Kibana attendent.
	// Avec l'encodeur Logstash il faudrait soit renommer chaque champ dans la
	// configuration Logback, soit poser un pipeline d'ingestion côté Elasticsearch :
	// de la traduction à maintenir en double, pour un JSON équivalent au bout.
	// Le nommage ECS est aussi ce qui rend un champ corrélable entre le back et
	// tout ce qui sera indexé plus tard (logs d'infrastructure, métriques).
	//
	// Version épinglée : le BOM Spring Boot ne gère pas ce groupe, une version
	// flottante ferait dépendre le format des logs de la date du build.
	runtimeOnly 'co.elastic.logging:logback-ecs-encoder:1.7.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	// Pilote PostgreSQL au seul classpath de test : la suite vise un vrai
	// PostgreSQL quand SPRING_DATASOURCE_URL est fournie, mais le jar livré reste
	// sur la base embarquée — et dependencyCheck n'analyse que runtimeClasspath.
	testRuntimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    // Sans ce réglage, PostgreSQL échoue faute de tables : Spring Boot ne met
    // `create-drop` que sur une base embarquée. `update` et non `create-drop`,
    // car les quatre contextes Spring de la suite partagent une seule base réelle.
    systemProperty 'spring.jpa.hibernate.ddl-auto', 'update'

    // Génère automatiquement le rapport de couverture après les tests.
    finalizedBy jacocoTestReport
}