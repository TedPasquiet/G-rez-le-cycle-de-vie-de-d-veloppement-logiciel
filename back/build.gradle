plugins {
	id 'java'
	id 'jacoco'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.0.15'
	id 'org.owasp.dependencycheck' version '12.2.2'
	id 'org.sonarqube' version '5.1.0.4882'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

// Linting statique du source Java. Ruleset : back/config/checkstyle/checkstyle.xml
checkstyle {
	toolVersion = '10.17.0'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
	// Bloque le build sur une violation. Passer à true pour un mode purement
	// consultatif (rapport publié sans faire échouer la CI).
	ignoreFailures = false
	// Le linting concerne le code de production ; les tests suivent des
	// conventions plus souples (fixtures, noms verbeux).
	sourceSets = [sourceSets.main]
}

// Formatage automatique du code Java (branché sur le hook pre-commit via
// lint-staged). Volontairement non-invasif : on n'impose pas un style complet
// (google-java-format), on nettoie l'essentiel — cohérent avec Checkstyle.
spotless {
	java {
		target 'src/**/*.java'
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		indentWithSpaces(4)
	}
}

// Couverture de test au format XML, consommée par SonarQube.
jacoco {
	toolVersion = '0.8.12'
}
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Analyse statique (recherche de bugs). Exclusions : back/config/spotbugs/exclude.xml
spotbugs {
	excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
	// Publie le rapport sans faire échouer le build ; passer à false pour un gate dur.
	ignoreFailures = true
}
spotbugsMain {
	reports {
		xml.required = true
		html.required = true
	}
}

// SCA : dépendances vulnérables (OWASP). Faux positifs : suppressions.xml
dependencyCheck {
	suppressionFile = "${rootDir}/config/dependency-check/suppressions.xml"
	formats = ['HTML', 'XML']
	// Score CVSS à partir duquel le build échoue (7 = High). Mettre 11 pour ne jamais bloquer.
	failBuildOnCVSS = 7
	// On n'analyse que ce qui part réellement dans le jar livré. Sans ça le scan
	// couvre aussi les outils de build (checkstyle, spotbugs, jacoco...) : plus lent,
	// et des CVE qui ne concernent pas l'application déployée.
	scanConfigurations = ['runtimeClasspath']
	analyzers {
		// Sonatype OSS Index : sans compte il est throttlé et échoue sur chaque
		// jar (des dizaines de lignes d'erreur dans le log). Le NVD suffit ici.
		ossIndexEnabled = false
	}
	// Depuis 2023 le NVD exige une clé API pour éviter le throttling. Voir variable CI NVD_API_KEY.
	// Sans elle le premier téléchargement de la base prend ~1 h au lieu de ~5 min.
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
}

// Métadonnées d'analyse SonarQube du back. host.url + token passés en CI.
//
// La clé de projet et l'organisation viennent des variables du pipeline
// (SONAR_PROJECT_KEY_BACK, SONAR_ORGANIZATION, définies dans .gitlab-ci.yml).
// Les valeurs écrites ici ne servent que de repli, pour qu'un `./gradlew sonar`
// lancé en local vise le bon projet sans avoir à exporter quoi que ce soit.
sonar {
	properties {
		property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY_BACK')
			?: 'pasquietted_G-rez-le-cycle-de-vie-de-d-veloppement-logiciel'
		property 'sonar.projectName', 'MicroCRM - Backend'
		property 'sonar.organization', System.getenv('SONAR_ORGANIZATION') ?: 'pasquietted'
		property 'sonar.coverage.jacoco.xmlReportPaths',
			"${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

// Le plugin Spring Boot produit deux archives dans build/libs : le jar
// exécutable (bootJar) et un « -plain.jar » qui ne contient que les classes,
// inutile ici. Le désactiver laisse un seul fichier, ce qui permet au
// Dockerfile de le copier avec un motif build/libs/*.jar sans avoir à écrire
// le numéro de version en dur.
tasks.named('jar') {
	enabled = false
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	// Actuator : expose /actuator/health, dont les sous-ressources liveness et
	// readiness consommées par les probes Kubernetes (voir K8S.md §5).
	// L'exposition est volontairement réduite dans application.properties.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	// Encodeur de logs JSON, consommé uniquement par logback-spring.xml : aucune
	// classe Java n'y fait référence, d'où `runtimeOnly` plutôt qu'`implementation`
	// (il reste hors du classpath de compilation, donc personne ne peut coupler le
	// code applicatif à une API de journalisation tierce par inadvertance).
	//
	// Pourquoi cette bibliothèque et pas Spring Boot lui-même : le *structured
	// logging* natif (logging.structured.format.console=ecs) n'arrive qu'en Spring
	// Boot 3.4 ; on est en 3.2.5 et monter la version du framework pour un besoin
	// d'observabilité serait un risque sans rapport avec le gain.
	//
	// Pourquoi ECS et pas net.logstash.logback:logstash-logback-encoder : les deux
	// produisent du JSON valide, mais l'encodeur Elastic émet directement le schéma
	// ECS (@timestamp, log.level, log.logger, error.stack_trace...), qui est celui
	// que les index templates et les écrans prêts à l'emploi de Kibana attendent.
	// Avec l'encodeur Logstash il faudrait soit renommer chaque champ dans la
	// configuration Logback, soit poser un pipeline d'ingestion côté Elasticsearch :
	// de la traduction à maintenir en double, pour un JSON équivalent au bout.
	// Le nommage ECS est aussi ce qui rend un champ corrélable entre le back et
	// tout ce qui sera indexé plus tard (logs d'infrastructure, métriques).
	//
	// Version épinglée : le BOM Spring Boot ne gère pas ce groupe, une version
	// flottante ferait dépendre le format des logs de la date du build.
	runtimeOnly 'co.elastic.logging:logback-ecs-encoder:1.7.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Génère automatiquement le rapport de couverture après les tests.
    finalizedBy jacocoTestReport
}