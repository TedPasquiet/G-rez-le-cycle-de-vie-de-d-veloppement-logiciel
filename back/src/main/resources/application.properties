spring.application.name=microcrm

# Origines autorisees a appeler l API (CORS). Liste explicite plutot qu un
# joker "*" : surchargeable par environnement via MICROCRM_CORS_ALLOWED_ORIGINS.
microcrm.cors.allowed-origins=http://localhost:4200

# --- Actuator ---------------------------------------------------------------
# Exposition minimale : seul "health" sort sur le web. Par defaut Actuator
# n'expose deja que health, mais je le declare explicitement pour que l'ajout
# d'un endpoint sensible (env, beans, heapdump, configprops) devienne un choix
# visible en revue plutot qu'un effet de bord. Le stage `security` du pipeline
# scanne l'image, il ne verra pas une mauvaise exposition applicative.
management.endpoints.web.exposure.include=health

# Active les groupes liveness et readiness, qui donnent
# /actuator/health/liveness et /actuator/health/readiness. Sans ce reglage ils
# n'existent qu'en environnement Kubernetes detecte automatiquement ; le forcer
# rend les URL identiques en local, en CI et sur le cluster.
management.endpoint.health.probes.enabled=true

# Pas de detail dans la reponse HTTP : /actuator/health est joignable sans
# authentification, il ne doit pas divulguer l'etat des composants internes
# (URL de base de donnees, disque, etc.) a un appelant anonyme.
management.endpoint.health.show-details=never
