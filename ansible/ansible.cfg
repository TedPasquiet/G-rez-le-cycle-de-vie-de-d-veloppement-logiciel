# Configuration Ansible du projet.
#
# ⚠️ Ansible ne lit ce fichier que si le répertoire courant est `ansible/`, ou
# si $ANSIBLE_CONFIG le désigne. Un `ansible-playbook ansible/site.yml` lancé
# depuis la racine du dépôt l'IGNORE en silence, et tourne alors sans
# inventaire — d'où le `cd ansible` dans toutes les commandes d'ANSIBLE.md.
# C'est une propriété d'Ansible, pas un choix du projet.

[defaults]
inventory = inventory/local.yml
roles_path = roles

# Sortie lisible par un humain : le rendu par défaut réduit un dictionnaire à
# une seule ligne JSON, ce qui rend illisible le récapitulatif d'un rôle.
#
# ⚠️ Ce n'est PAS `stdout_callback = yaml`. Ce greffon-là venait de
# community.general et en a été RETIRÉ en 12.0.0 — le poste étant en 13.1.0,
# le désigner fait échouer tout le playbook avant la première tâche, sur « The
# 'community.general.yaml' callback plugin has been removed ». Le remplaçant
# est une option du greffon par défaut d'ansible-core, depuis la 2.13.
stdout_callback = default
result_format = yaml

# Le playbook ne touche que le poste : la bannière « [WARNING]: provided hosts
# list is empty » et les rappels de dépréciation n'apportent rien ici, mais on
# ne les coupe PAS — une dépréciation silencieuse est ce qui fait qu'un
# playbook cesse de fonctionner à la montée de version suivante sans qu'on
# sache pourquoi.
deprecation_warnings = True

# Aucune escalade de privilèges par défaut. Rien de ce que fait ce playbook n'a
# besoin de root : Homebrew refuse même de tourner en root. Un `become: true`
# posé par réflexe casserait l'installation des formules.
become = False

# Le poste tourne sur macOS avec un Python de Homebrew. Laisser Ansible
# découvrir l'interpréteur évite le message « discovered_interpreter_python »
# à chaque exécution.
interpreter_python = auto_silent

[inventory]
# Un inventaire introuvable doit être une erreur, pas un avertissement suivi
# d'une exécution sur zéro hôte qui se termine en succès.
unparsed_is_failed = True
