# Analyse SonarQube du front Angular.
# Lancée par sonar-scanner-cli (le plugin Gradle ne couvre que le back).
#
# projectKey et organization ne servent que de repli, pour qu'un sonar-scanner
# lancé en local vise le bon projet. En CI, le job sonar-front les surcharge
# avec -D à partir des variables SONAR_PROJECT_KEY_FRONT et SONAR_ORGANIZATION
# définies dans .gitlab-ci.yml, qui font autorité.
sonar.projectKey=pasquietted_G-rez-le-cycle-de-vie-de-d-veloppement-logiciel-front
sonar.projectName=MicroCRM - Frontend
sonar.organization=pasquietted

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts

sonar.sourceEncoding=UTF-8

# Couverture produite par `ng test --code-coverage` (reporter lcovonly de karma.conf.js)
sonar.javascript.lcov.reportPaths=coverage/microcrm/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
