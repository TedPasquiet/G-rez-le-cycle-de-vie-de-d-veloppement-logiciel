stages:
  - lint
  - test
  - build
.rules_test: &rules_test
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\//'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
.rules_build: &rules_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\//'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
lint-front:
  image: node
  stage: lint
  script:
    - cd front
    - npm ci
    - npx @angular/cli lint
  <<: *rules_test
lint-back:
  image: gradle:jdk17
  stage: lint
  script:
    - cd back
    - ./gradlew checkstyleMain
  <<: *rules_test
test-front:
  image: cypress/browsers:latest
  stage: test
  script:
    - cd front
    - npm ci
    - CHROME_BIN=/opt/google/chrome/chrome npx @angular/cli test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox
  <<: *rules_test
test-back:
  image: gradle:jdk17
  stage: test
  script:
    - cd back
    - ./gradlew test
  <<: *rules_test
build-front:
  image: node
  stage: build
  script:
    - cd front
    - npm ci
    - npx @angular/cli build --optimization
  <<: *rules_build
build-back:
  image: gradle:jdk17
  stage: build
  script:
    - cd back
    - ./gradlew build
  <<: *rules_build