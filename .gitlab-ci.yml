# ===========================================================================
# Le pipeline de MicroCRM — point d'entrée
# ===========================================================================
# Ce fichier ne contient plus aucun job. Il déclare l'ordre des étapes et
# assemble les fichiers de `.gitlab/ci/`, un par domaine.
#
# POURQUOI CE DÉCOUPAGE, et ce qu'il a coûté. Le fichier unique pesait 1071
# lignes pour 32 jobs — dont 45 % de commentaires, qui expliquent des pièges
# réels et qu'il n'était pas question de supprimer. Le problème n'était donc pas
# la longueur, c'était qu'AUCUN des trois mécanismes de modularité de GitLab
# n'était utilisé : ni `include:`, ni `extends:`, ni `trigger:`. La cartographie
# préalable est dans docs/pipeline-ci.md.
#
# ⚠️ L'ORDRE DES TRAVAUX N'ÉTAIT PAS LIBRE. Les ancres YAML (`&cache_gradle`,
# `*rules_test`…) sont résolues à la lecture d'UN document : elles ne franchissent
# pas un `include:`. Découper d'abord aurait cassé les 32 jobs d'un coup. Il
# fallait donc convertir les ancres en `extends:` AVANT de découper — c'est ce
# que porte `templates.yml`, où le raisonnement est détaillé.
#
# Ce que le découpage ne change pas : le graphe des jobs, leurs règles, leurs
# durées. Un pipeline assemblé depuis dix fichiers est, pour GitLab, exactement
# le même document que le fichier unique d'avant.
# ===========================================================================

include:
  # Les variables d'abord : tout le reste s'y réfère. L'ordre n'a pas
  # d'importance pour GitLab — qui assemble tout avant de résoudre quoi que ce
  # soit — mais il en a pour qui lit.
  - local: '/.gitlab/ci/variables.yml'
  # Puis les gabarits, que les fichiers de domaine étendent.
  - local: '/.gitlab/ci/templates.yml'
  # Enfin les jobs, un fichier par domaine, dans l'ordre des étapes.
  - local: '/.gitlab/ci/lint.yml'
  - local: '/.gitlab/ci/test.yml'
  - local: '/.gitlab/ci/quality.yml'
  - local: '/.gitlab/ci/security.yml'
  - local: '/.gitlab/ci/infra.yml'
  - local: '/.gitlab/ci/package.yml'
  # La performance n'est pas incluse : elle est DÉCLENCHÉE. Le fichier ci-dessous
  # ne porte qu'un job `trigger:`, qui crée un pipeline enfant — le raisonnement
  # et les deux candidats écartés y sont écrits.
  - local: '/.gitlab/ci/perf-trigger.yml'
  - local: '/.gitlab/ci/deploy.yml'

stages:
  - lint
  - test
  - quality
  - security
  # L'infrastructure se valide AVANT qu'on ne construise quoi que ce soit :
  # un chart, un manifeste ou un plan Terraform cassé n'a pas besoin d'attendre
  # une compilation Gradle pour être signalé. Après `security` en revanche, pour
  # que les scans tournent sur du code encore frais dans le cache.
  - infra
  - build
  - package
  - perf
  - deploy
  # ⚠️ `infra-apply` est en DERNIER, et c'est un correctif, pas un rangement.
  #
  # Les trois `terraform-apply-<env>` sont des jobs manuels SANS
  # `allow_failure` — délibérément, car un apply interrompu laisse
  # l'infrastructure dans un état intermédiaire et le pipeline doit le dire.
  # Or un job manuel non-`allow_failure` est un job BLOQUANT : « the pipeline
  # stops at the stage where the job is defined ». Tant qu'ils vivaient dans
  # l'étape `infra`, tout pipeline de `main` s'arrêtait là — build, package,
  # perf et deploy n'étaient jamais atteints tant que personne ne cliquait.
  #
  # Les placer en dernier garde le caractère bloquant (l'échec d'un apply reste
  # un échec de pipeline) sans rien bloquer en amont : il n'y a plus rien
  # derrière. `deploy-production` et `rollback-production` sont dans le même cas
  # et pour la même raison — eux sont déjà dans la dernière étape utile.
  - infra-apply
